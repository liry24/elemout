help:
    title: CSS Selector Reference
    description: Reference for the CSS selector syntax available in Elemout rules.
    copySelector: Copy selector
    copiedSelector: Selector copied
    table:
        syntax: Syntax
        description: Description
        example: Example
    sections:
        basic:
            title: Basic selectors
            items:
                id: Element with a matching id attribute
                class: Element with the specified class
                element: Element with the specified tag name
                all: All elements
        attribute:
            title: Attribute selectors
            items:
                present: Element that has the attribute
                exact: Attribute exactly matches the value
                startsWith: Attribute starts with the value
                endsWith: Attribute ends with the value
                contains: Attribute contains the value
                word: Attribute contains the word in a space-separated list
        combinator:
            title: Combinators
            items:
                descendant: B that exists anywhere inside A
                child: B that is a direct child of A
                adjacent: B that immediately follows A
                siblings: All B siblings that come after A
                group: A or B as a combined selector list
        pseudo:
            title: Pseudo-classes
            items:
                firstChild: First child of the parent element
                lastChild: Last child of the parent element
                nthChild: nth child of the parent element
                not: Element that does not match the selector
                empty: Element with no children or content
                has: Element that contains a descendant matching the selector
    examples:
        title: Practical examples
        items:
            prefix:
                title: Hide elements whose IDs share a prefix
                description: Targets every element whose id starts with "ad-".
            classContains:
                title: Hide elements whose class contains "ad"
                description: Targets every element whose class attribute contains the text "ad".
            dataAttribute:
                title: Hide elements marked by a data attribute
                description: Targets every element that has the data-sponsored attribute.
            multiple:
                title: Combine multiple conditions in one rule
                description: You can register multiple selectors as a single rule by separating them with commas.
