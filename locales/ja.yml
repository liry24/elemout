help:
    title: CSS セレクタ リファレンス
    description: Elemout のルールで使用できる CSS セレクタ構文の一覧です。
    copySelector: セレクタをコピー
    copiedSelector: セレクタをコピーしました
    table:
        syntax: 構文
        description: 説明
        example: 例
    sections:
        basic:
            title: 基本セレクタ
            items:
                id: id 属性が一致する要素
                class: class 属性を持つ要素
                element: 指定したタグ名の要素
                all: すべての要素
        attribute:
            title: 属性セレクタ
            items:
                present: attr 属性を持つ要素
                exact: attr が val に完全一致
                startsWith: attr が prefix で始まる（前方一致）
                endsWith: attr が suffix で終わる（後方一致）
                contains: attr が str を含む（部分一致）
                word: attr がスペース区切りのリストに word を含む
        combinator:
            title: 結合子
            items:
                descendant: A の子孫にある B
                child: A の直下の子 B
                adjacent: A の直後の兄弟 B
                siblings: A より後ろのすべての兄弟 B
                group: A または B（複数まとめて指定）
        pseudo:
            title: 疑似クラス
            items:
                firstChild: 親要素の最初の子
                lastChild: 親要素の最後の子
                nthChild: 親要素の n 番目の子
                not: 指定セレクタに一致しない要素
                empty: 子要素も内容も持たない要素
                has: 指定セレクタを子孫に持つ要素
    examples:
        title: 実用例
        items:
            prefix:
                title: ID がプレフィックスで始まる要素をまとめて非表示
                description: id が "ad-" で始まるすべての要素を対象にします。
            classContains:
                title: クラスに "ad" を含む要素をまとめて非表示
                description: class 属性に "ad" という文字列を含む要素をすべて対象にします。
            dataAttribute:
                title: data 属性でマークされた要素を非表示
                description: data-sponsored 属性を持つ要素をすべて対象にします。
            multiple:
                title: 複数の条件をまとめて指定
                description: カンマ区切りで複数のセレクタを 1 つのルールとして登録できます。
